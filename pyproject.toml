[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outbreak"
version = "0.1.0"
description = "A terminal-based educational pathogen versus host game."
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "black>=26.0",
    "flake8>=7.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.black]
target-version = ["py313"]
line-length = 88

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outbreak = ["data/*.json"]
